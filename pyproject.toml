[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reach"
version = "0.1.0"
description = "Sandbox CLI for agent outreach workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
agent-reach = "agent_reach.cli:main"

[tool.setuptools]
packages = ["agent_reach"]
