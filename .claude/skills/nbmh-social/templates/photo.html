<!doctype html>
<meta charset="utf-8">
<title>NBMH {{DATE}}</title>
<link rel="stylesheet" href="../../../.claude/skills/nbmh-social/templates/base.css">
<style>
/* Standing photo layout (Charles's reference, 2026-10-11): a frosted header band at the top
   (logo, headline, service line) and a matching frosted band at the bottom (coverage, then CTA).
   Light translucent glass, centered, dark green type. Text never sits directly on the photo. */
@font-face { font-family: Playfair; font-weight: 600; src: url("../../../.claude/skills/nbmh-social/assets/fonts/PlayfairDisplay-600.ttf"); }
@font-face { font-family: Montserrat; font-weight: 500; src: url("../../../.claude/skills/nbmh-social/assets/fonts/Montserrat-500.ttf"); }
@font-face { font-family: Montserrat; font-weight: 600; src: url("../../../.claude/skills/nbmh-social/assets/fonts/Montserrat-600.ttf"); }
@font-face { font-family: Montserrat; font-weight: 700; src: url("../../../.claude/skills/nbmh-social/assets/fonts/Montserrat-700.ttf"); }
body { font-family: Montserrat, sans-serif; }

.photo { position: absolute; inset: 0; z-index: 0; }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 50%; display: block; }

.band {
  position: absolute; z-index: 4; left: 0; right: 0; text-align: center;
  background: rgba(255,255,255,.42);
  backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2);
}
.band.top { top: 0; padding: 34px 60px 30px; }
.band.bottom { bottom: 0; padding: 26px 60px 32px; }

.brand { display: inline-flex; align-items: center; gap: 16px; text-align: left; }
.brand img { width: 76px; height: 76px; border-radius: 50%; display: block; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.brand .n1 { font-size: 29px; font-weight: 700; letter-spacing: .06em; color: var(--forest); line-height: 1.12; }
.brand .n2 { font-size: 20px; font-weight: 500; letter-spacing: .24em; color: var(--pine); line-height: 1.12; }

.headline {
  font-family: Playfair, serif; font-weight: 600; font-size: 90px; line-height: 1.02;
  letter-spacing: -.012em; color: var(--forest); margin: 16px 0 12px; text-wrap: balance;
}
.service { font-size: 19px; font-weight: 700; letter-spacing: .16em; color: var(--ink); }

/* Coverage is fixed copy on every post, always above the CTA (approved-facts.md). */
.coverage { font-size: 23px; font-weight: 500; line-height: 1.45; color: var(--ink); }
.coverage .label { display: block; font-size: 18px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #B23A63; margin-bottom: 4px; }
.coverage .plan { font-weight: 700; color: var(--forest); white-space: nowrap; }
.coverage .private { display: block; font-size: 21px; }
.coverage .sep { color: #B23A63; font-weight: 700; }
.cta {
  margin-top: 14px; padding-top: 14px; border-top: 1.5px solid rgba(18,64,45,.2);
  font-size: 26px; font-weight: 700; letter-spacing: 0; color: var(--forest); white-space: nowrap;
}
.cta .sep { color: #B23A63; margin: 0 14px; }
</style>

<div class="canvas">
  <div class="photo"><img src="./photo.jpg" alt=""></div>

  <div class="band top">
    <div class="brand">
      <img src="../../../.claude/skills/nbmh-social/assets/nbmh-logo.png" alt="New Beginnings Mental Health">
      <div><div class="n1">NEW BEGINNINGS</div><div class="n2">MENTAL HEALTH</div></div>
    </div>
    <h1 class="headline">{{HEADLINE}}</h1>
    <div class="service">{{SERVICE}}</div>
  </div>

  <div class="band bottom">
    <div class="coverage"><span class="label">In-network with</span> <span class="plan">Aetna</span> <span class="sep">·</span> <span class="plan">Anthem Blue Cross Blue Shield</span> <span class="sep">·</span> <span class="plan">UnitedHealthcare</span> <span class="sep">·</span> <span class="plan">Cigna</span> <span class="sep">·</span> <span class="plan">Mountain Strong EAP</span> <span class="sep">·</span> <span class="plan">Olivia's Fund</span>.<span class="private">Private-pay appointments are also available.</span></div>
    <div class="cta">NBMentalHealth.com<span class="sep">·</span>970-470-2939<span class="sep">·</span>charles@nbmentalhealth.com</div>
  </div>
</div>
