<style>
:root{--ink:#04070d;--panel:#080e18;--edge2:#22314c;--sig:#38bdf8;--head:#f4f8fd;--body:#c3d2e4;--slate:#8aa0bd;--slate2:#5c7291;--rec:#ff453a}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--body);font:300 17px/1.7 Manrope,system-ui,sans-serif}
#gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:30px 16px}

  }).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(PAYLOAD.iv)},k,b2a(PAYLOAD.ct));})
    .then(function(buf){return new TextDecoder().decode(buf);});
}
function attempt(code,quiet){
  var c=String(code||'').trim().toUpperCase(), err=document.getElementById('gerr');
  err.textContent='';
  return decrypt(c).then(function(h){
    try{sessionStorage.setItem(SKEY,c);}catch(x){}
    document.open(); document.write(h); document.close();
  }).catch(function(x){
    if(quiet) return;
    err.textContent = (x&&x.message==='insecure') ? 'This page must be opened over https to unlock.' : 'That code did not work. Check your purchase confirmation.';
  });
}
document.getElementById('gform').addEventListener('submit',function(e){e.preventDefault();attempt(document.getElementById('gin').value,false);});
var r=null; try{r=sessionStorage.getItem(SKEY);}catch(x){}
if(r) attempt(r,true); else document.getElementById('gin').focus();
})();
