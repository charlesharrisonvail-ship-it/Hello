/* Concept: "Better Sleep, Better You" — tactile composition featuring natural sleep
   textures (linen, cotton, plants, soft light). Clean educational approach pairing
   sleep education with Medication Management. Warm, grounded palette. */

.canvas {
  background: #FBF9F6;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Texture background — three zones of soft, overlapping fabric textures */
.texture-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}

.texture-zone-1 {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 45%;
  background: linear-gradient(135deg, #E8DFD5 0%, #F3EBE3 100%);
  opacity: 0.6;
}

.texture-zone-2 {
  position: absolute;
  top: 30%;
  left: 0;
  width: 100%;
  height: 50%;
  background: linear-gradient(45deg, #F5EDE5 0%, #EFE6DD 100%);
  opacity: 0.4;
}

.texture-zone-3 {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 40%;
  background: linear-gradient(-45deg, #E2D5CB 0%, #F0E8E0 100%);
  opacity: 0.5;
}

/* Plant accent — simple leaf shapes in soft green */
.plant-accent {
  position: absolute;
  bottom: 120px;
  right: 48px;
  width: 120px;
  height: 180px;
  z-index: 1;
  opacity: 0.35;
}

.leaf {
  position: absolute;
  background: #9DB89D;
  border-radius: 50% 50% 50% 0;
  transform-origin: center;
}

.leaf-1 {
  width: 48px;
  height: 72px;
  top: 20px;
  left: 0;
  transform: rotate(-25deg);
}

.leaf-2 {
  width: 52px;
  height: 78px;
  top: 40px;
  left: 50px;
  transform: rotate(15deg);
}

.leaf-3 {
  width: 46px;
  height: 68px;
  top: 80px;
  left: 20px;
  transform: rotate(-15deg);
}

/* Main content */
.masthead {
  position: absolute;
  top: 64px;
  left: var(--gutter);
  display: flex;
  align-items: center;
  gap: 18px;
  z-index: 5;
}

.masthead img {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  display: block;
}

.masthead .wordmark {
  line-height: 1.16;
}

.masthead .n1 {
  font-size: 25px;
  font-weight: 700;
  letter-spacing: .055em;

}

.masthead .n2 {

}

  top: 220px;

  right: var(--gutter);
  z-index: 4;
}

.lede .eyebrow {
  display: block;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .17em;
  color: #8B7F77;
  margin-bottom: 16px;

}

.lede .headline {
  font-size: 64px;

  padding: 26px 38px;
  border-radius: 6px;
}
