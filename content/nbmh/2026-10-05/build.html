<!doctype html>
<meta charset="utf-8">
<title>NBMH 2026-10-05</title>
<link rel="stylesheet" href="../../../.claude/skills/nbmh-social/templates/base.css">
<style>
/* Concept: "Clarity Through Calm" — clean educational layout for anxiety/stress education.
   Organized information design with calm palette. Cool tones, structured composition.
   Suggests grounding and focus. Different from recent warm and textured approaches. */

.canvas {
  background: #F5F3F0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Subtle structured background with three distinct zones */
.structure-zones {
  position: absolute;
  inset: 0;
  z-index: 0;
}

.zone-1 {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 380px;
  background: linear-gradient(180deg, #F5F3F0 0%, #EEE9E5 100%);
}

.zone-2 {
  position: absolute;
  top: 380px;
  left: 0;
  width: 100%;
  height: 420px;
  background: linear-gradient(180deg, rgba(144, 159, 155, 0.05) 0%, transparent 100%);
}

.zone-3 {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 280px;
  background: linear-gradient(180deg, transparent 0%, rgba(200, 210, 208, 0.08) 100%);
}

.masthead {
  position: absolute;
  top: 64px;
  left: var(--gutter);
  display: flex;
  align-items: center;
  gap: 18px;
  z-index: 5;
}

.masthead img {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  display: block;
}

.masthead .wordmark {
  line-height: 1.16;
}

.masthead .n1 {
  font-size: 25px;
  font-weight: 700;
  letter-spacing: .055em;
  color: #3A3530;
}

.masthead .n2 {
  font-size: 19px;
  font-weight: 400;
  letter-spacing: .145em;
  color: #6B6660;
}

.datestamp {
  position: absolute;
  top: 80px;
  right: var(--gutter);
  z-index: 5;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .2em;
  color: #9D9290;
}

.lede {
  position: absolute;
  top: 240px;
  left: var(--gutter);
  right: var(--gutter);
  z-index: 4;
}

.lede .eyebrow {
  display: block;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .17em;
  color: #7B8F8C;
  margin-bottom: 16px;
  text-transform: uppercase;
}

.lede .headline {
  font-size: 64px;
  color: #2D2620;
  margin: 0;
  line-height: 1.2;
  font-weight: 700;
  margin-bottom: 24px;
}

.lede .subline {
  font-size: 20px;
  color: #6B6660;
  line-height: 1.5;
  margin: 0;
  font-weight: 400;
}

.service {
  position: absolute;
  z-index: 5;
  left: var(--gutter);
  bottom: 176px;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .14em;
  color: #5C5550;
}

.footer {
  position: absolute;
  left: var(--gutter);
  right: var(--gutter);
  bottom: 64px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: .012em;
  z-index: 5;
  color: #3A3530;
  background: rgba(239, 234, 229, 0.9);
  padding: 26px 38px;
  border-radius: 6px;
}
</style>

<div class="canvas">
  <div class="structure-zones">
    <div class="zone-1"></div>
    <div class="zone-2"></div>
    <div class="zone-3"></div>
  </div>

  <div class="masthead">
    <img src="../../../.claude/skills/nbmh-social/assets/nbmh-logo.png" alt="New Beginnings Mental Health">
    <div class="wordmark">
      <div class="n1">NEW BEGINNINGS</div>
      <div class="n2">MENTAL HEALTH</div>
    </div>
  </div>

  <div class="datestamp">OCT 5</div>

  <div class="lede">
    <span class="eyebrow">Anxiety and Stress</span>
    <h1 class="headline">Clarity Through Calm</h1>
    <p class="subline">When anxiety or stress feel overwhelming, medication management can help you find steadiness and perspective.</p>
  </div>

  <div class="service">ANXIETY EDUCATION · MEDICATION MANAGEMENT</div>

  <div class="footer">
    <span>NBMentalHealth.com</span>
    <span>970-470-2939</span>
  </div>
</div>
