<!doctype html>
<meta charset="utf-8">
<title>NBMH 2026-10-06</title>
<link rel="stylesheet" href="../../../.claude/skills/nbmh-social/templates/base.css">
<style>
/* Concept: "Light in the Dark" — Higgsfield nature photography with gentle text overlay.
   Golden hour forest light suggesting hope and recovery. Beautiful, calming imagery. */

.canvas {
  background: #F0E8DD;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.image-container {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; z-index: 0;
}

.image-container img {
  width: 100%; height: 100%;
  object-fit: cover;
}

/* Subtle overlay for text readability */
.overlay {
  position: absolute; inset: 0; z-index: 2;
  display: flex; flex-direction: column; justify-content: space-between;
  background: linear-gradient(180deg, rgba(0,0,0,.14) 0%, rgba(0,0,0,0) 50%, rgba(0,0,0,.20) 100%);
  padding: var(--gutter);
}

.masthead {
  position: absolute; top: 64px; left: var(--gutter);
  display: flex; align-items: center; gap: 18px; z-index: 5;
}
.masthead img { width: 62px; height: 62px; border-radius: 50%; display: block; }
.masthead .wordmark { line-height: 1.16; }
.masthead .n1 { font-size: 25px; font-weight: 700; letter-spacing: .055em; color: white; }
.masthead .n2 { font-size: 19px; font-weight: 400; letter-spacing: .145em; color: rgba(255,255,255,.88); }

.datestamp {
  position: absolute; top: 80px; right: var(--gutter); z-index: 5;
  font-size: 15px; font-weight: 600; letter-spacing: .2em;
  color: rgba(255,255,255,.65);
}

.lede {
  position: absolute; top: 260px; left: var(--gutter); right: var(--gutter);
  z-index: 4; text-align: center;
}

.lede .eyebrow {
  display: block; font-size: 18px; font-weight: 700;
  letter-spacing: .17em; color: rgba(255,255,255,.70);
  margin-bottom: 20px; text-transform: uppercase;
}

.lede .headline {
  font-size: 68px; color: white;
  margin-bottom: 0; line-height: 1.1;
  text-shadow: 0 2px 8px rgba(0,0,0,.32);
  font-weight: 700;
}

.service {
  position: absolute; z-index: 5; left: var(--gutter); bottom: 176px;
  font-size: 20px; font-weight: 700; letter-spacing: .165em;
  color: rgba(255,255,255,.80);
  text-shadow: 0 1px 4px rgba(0,0,0,.24);
}

.footer {
  position: absolute; left: var(--gutter); right: var(--gutter); bottom: 64px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 25px; font-weight: 600; letter-spacing: .012em;
  z-index: 5; color: white;
  background: rgba(0,0,0,.26); padding: 26px 38px; border-radius: 6px;
  text-shadow: 0 1px 3px rgba(0,0,0,.24);
}
</style>

<div class="canvas">
  <div class="image-container">
    <img src="./nbmh-2026-10-06.jpg" alt="">
  </div>

  <div class="masthead">
    <img src="../../../.claude/skills/nbmh-social/assets/nbmh-logo.png" alt="New Beginnings Mental Health">
    <div class="wordmark">
      <div class="n1">NEW BEGINNINGS</div>
      <div class="n2">MENTAL HEALTH</div>
    </div>
  </div>
  <div class="datestamp">OCT 6</div>

  <div class="lede">
    <span class="eyebrow">Depression and Mood</span>
    <h1 class="headline">Light in the Dark</h1>
  </div>

  <div class="service">DEPRESSION EDUCATION · MEDICATION MANAGEMENT</div>

  <div class="footer">
    <span>NBMentalHealth.com</span>
    <span>970-470-2939</span>
  </div>
</div>
