<!doctype html>
<meta charset="utf-8">
<title>NBMH 2026-10-10</title>
<link rel="stylesheet" href="../../../.claude/skills/nbmh-social/templates/base.css">
<style>
/* Standing photo layout: full-bleed photograph, text on solid surfaces only.
   White text is never set directly on the photo; bright skies made it unreadable (2026-10-06). */

.photo { position: absolute; inset: 0; z-index: 0; }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 35%; display: block; }

.top-scrim {
  position: absolute; left: 0; right: 0; top: 0; height: 230px; z-index: 1;
  background: linear-gradient(180deg, rgba(10,30,22,.72) 0%, rgba(10,30,22,.38) 60%, rgba(10,30,22,0) 100%);
}
.masthead .n1, .masthead .n2, .datestamp { color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.45); }
.datestamp { opacity: .9; }
.masthead img { box-shadow: 0 2px 10px rgba(0,0,0,.35); }

.card {
  position: absolute; z-index: 4; left: var(--gutter); right: var(--gutter); bottom: 188px;
  background: rgba(250,246,240,.96);
  border-radius: 10px; padding: 44px 52px 40px;
  box-shadow: 0 18px 50px rgba(0,0,0,.28);
}
.card .eyebrow { display: block; color: var(--pine); font-size: 18px; margin-bottom: 16px; }
.card .headline { font-size: 66px; color: var(--forest); }
.card .rule { margin: 26px 0 20px; }
.card .service { font-size: 18px; font-weight: 700; letter-spacing: .14em; color: var(--ink); }

.footer { background: var(--forest); color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
</style>

<div class="canvas">
  <div class="photo"><img src="./photo.jpg" alt=""></div>
  <div class="top-scrim"></div>

  <div class="masthead">
    <img src="../../../.claude/skills/nbmh-social/assets/nbmh-logo.png" alt="New Beginnings Mental Health">
    <div class="wordmark">
      <div class="n1">NEW BEGINNINGS</div>
      <div class="n2">MENTAL HEALTH</div>
    </div>
  </div>
  <div class="datestamp">OCT 10</div>

  <div class="card">
    <span class="eyebrow">TRACKING SIDE EFFECTS</span>
    <h1 class="headline">Notice What Changes</h1>
    <div class="rule"></div>
    <div class="service">MEDICATION MANAGEMENT · TELEHEALTH ACROSS COLORADO</div>
  </div>

  <div class="footer">
    <span>NBMentalHealth.com</span>
    <span>970-470-2939</span>
  </div>
</div>
