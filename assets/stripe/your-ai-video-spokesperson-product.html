<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Manrope:wght@400;500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:1200px;background:#05070c;overflow:hidden}
.c{position:relative;width:1200px;height:1200px;box-sizing:border-box;padding:96px;
 background:radial-gradient(900px 600px at 95% 0%,rgba(214,58,112,.16),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(56,189,248,.10),transparent 60%),#05070c}
.logo{font:800 56px/1 Archivo,sans-serif;letter-spacing:-1px;color:#8496b2;display:flex;align-items:baseline}
.logo .a{color:#fff}.logo .re{color:#38bdf8}.logo .i{position:relative;color:#fff}
.logo .i:before{content:"";position:absolute;left:50%;top:-22px;width:18px;height:18px;margin-left:-9px;border:5px solid #38bdf8;border-radius:50%;box-sizing:border-box}

.kick:after{content:"";width:160px;height:2px;background:#d63a70;opacity:.7}
h1{margin:34px 0 0;font:900 132px/.95 Archivo,sans-serif;letter-spacing:-5px;color:#fff}
h1 em{font-style:normal;color:#d63a70;display:block}
.sub{margin-top:44px;font:400 39px/1.42 Manrope,sans-serif;color:#cbd5e1;max-width:900px}
.chips{display:flex;gap:18px;margin-top:62px}
.chip{border:2px solid rgba(255,255,255,.18);border-radius:6px;padding:16px 22px;font:600 28px 'IBM Plex Mono',monospace;color:#fff;letter-spacing:.04em}
.chip b{color:#d63a70;font-weight:600}
.rule{position:absolute;left:96px;right:96px;bottom:200px;height:2px;background:rgba(255,255,255,.1)}
.price{position:absolute;right:96px;bottom:92px;font:900 92px/1 Archivo,sans-serif;color:#fff;letter-spacing:-2px}
</style></head><body><div class="c">
<div class="logo"><span class="a">A</span><span class="i">ı</span><span class="re">RE</span><span class="est">Estate</span></div>

<div class="chips"><div class="chip"><b>7</b> modules + Capstone</div><div class="chip">29 min video</div><div class="chip">Certificate</div></div>
<div class="rule"></div>
<div class="price">$97</div>
</div></body></html>
