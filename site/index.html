<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <a class="brand" href="/">Hello World</a>
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="/about">About</a>
    </nav>
  </header>

  <main>
    <h1>Hello World</h1>
    <p class="lede">A small demo page so the Playwright suite has something real to drive.</p>

    <form id="greet-form" novalidate>
      <label for="name">
        Your name
        <input id="name" name="name" type="text" autocomplete="name" placeholder="Ada Lovelace">
      </label>
      <p class="error" id="name-error" role="alert"></p>
      <button type="submit">Say hello</button>
      <p class="status" id="greeting" hidden></p>
    </form>

    <section id="counter" aria-labelledby="counter-heading">
      <h2 id="counter-heading">Counter</h2>
      <output aria-label="Current count">0</output>
      <ul class="counter-controls">
        <li><button type="button" data-step="-1" aria-label="Decrement">−1</button></li>
        <li><button type="button" data-step="1" aria-label="Increment">+1</button></li>
      </ul>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
